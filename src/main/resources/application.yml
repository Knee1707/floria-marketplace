# ============================================================
# StarShop - cấu hình chung (Leader sở hữu, thành viên KHÔNG sửa)
# Bí mật thật để trong biến môi trường, KHÔNG commit lên Git.
# ============================================================
spring:
  application:
    name: starshop

  datasource:
    url: jdbc:postgresql://localhost:5432/starshop
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # Flyway là NGUỒN SCHEMA DUY NHẤT, không để Hibernate tạo bảng
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # JSP view resolver
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # Gmail SMTP để gửi OTP (dùng App Password, KHÔNG dùng mật khẩu Gmail thường)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:your-email@gmail.com}
    password: ${MAIL_APP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# ===== Cấu hình riêng của StarShop =====
starshop:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-long!!}
    access-token-minutes: 30
    refresh-token-days: 7
  otp:
    length: 6
    ttl-minutes: 5
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
    api-key: ${CLOUDINARY_API_KEY:your-api-key}
    api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:your-tmn-code}
    hash-secret: ${VNPAY_HASH_SECRET:your-hash-secret}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:8080/checkout/vnpay-return

logging:
  level:
    com.starshop: DEBUG
    org.flywaydb: INFO
